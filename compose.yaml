name: house-radar

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-house_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-house_radar}
      POSTGRES_DB: ${POSTGRES_DB:-house_radar}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" &&
          psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc
          "SELECT 1 FROM pg_available_extensions WHERE name = 'postgis'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability stack. Opt-in: `docker compose --profile observability up -d` (see `pnpm infra:up:obs`).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    ports:
      - '${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'
      - '${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317'
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    ports:
      - '${PROMETHEUS_PORT:-59090}:9090'
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/healthy']
      interval: 5s
      timeout: 3s
      retries: 10

  loki:
    profiles: [observability]
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - '${GRAFANA_PORT:-3030}:3000'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
