name: Bug report
description: Report something that does not work as documented.
title: 'bug: '
labels: ['type:bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - docs
        - api
        - web
        - ingestion
        - packages
        - infra
        - ci
        - other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, OS, browser or commit, as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data first.
